name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio

      - name: Run Ruff (linting)
        run: |
          ruff check la_creatura_bot.py economy/ console.py test_shop_and_lottery.py

      - name: Run Ruff (format check)
        run: |
          ruff format --check la_creatura_bot.py economy/ console.py test_shop_and_lottery.py

      - name: Run MyPy (type checking)
        run: |
          mypy --ignore-missing-imports la_creatura_bot.py economy/ console.py

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Run tests
        run: |
          python -m pytest test_shop_and_lottery.py -v --tb=short

      - name: Verify syntax compilation
        run: |
          python -m py_compile la_creatura_bot.py economy/*.py console.py

  build-check:
    name: Build & Startup Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify database initialization
        run: |
          # No Discord token is needed for this check.  A fake token causes
          # discord.py to fail with 401 before the database can be inspected.
          : > .env
          echo "BOT_%=%" >> .env
          echo "DATA_FILE_PATH=stats.db" >> .env
          echo "LOG_LEVEL=DEBUG" >> .env

          python -c "import asyncio; from economy.database import DataManager; asyncio.run(DataManager('stats.db').initialize())"
          
          # Verify database file was created
          if [ -f stats.db ]; then
            echo "✅ Database file created successfully"
            ls -la stats.db
          else
            echo "❌ Database file NOT created"
            exit 1
          fi
          
          # Verify schema
          python -c "
          import aiosqlite, asyncio
          async def check():
              async with aiosqlite.connect('stats.db') as db:
                  db.row_factory = aiosqlite.Row
                  async with db.execute('SELECT name FROM sqlite_master WHERE type=\"table\"') as c:
                      tables = await c.fetchall()
                      print('Tables:', [t['name'] for t in tables])
                  # Check users table
                  async with db.execute('PRAGMA table_info(users)') as c:
                      cols = await c.fetchall()
                      print('Users columns:', [col['name'] for col in cols])
                  # Check indexes
                  async with db.execute('SELECT name FROM sqlite_master WHERE type=\"index\"') as c:
                      idx = await c.fetchall()
                      print('Indexes:', [i['name'] for i in idx])
          asyncio.run(check())
          "

  # Optional: Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Bandit (security linting)
        run: |
          pip install bandit
          bandit -r la_creatura_bot.py economy/ console.py -f json -o bandit-report.json || true
          
      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
